
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI 智能简报</title>
<style>
:root {
  --bg-light:#f6f8fb;
  --card-light:#ffffff;
  --text-light:#111;
  --accent:#2563eb;

  --bg-dark:#0f172a;
  --card-dark:#1e293b;
  --text-dark:#f1f5f9;
}

body {
  margin:0;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont;
  background:var(--bg-light);
  color:var(--text-light);
}

@media (prefers-color-scheme: dark) {
  body {
    background:var(--bg-dark);
    color:var(--text-dark);
  }
  .card {
    background:var(--card-dark);
  }
}

h1 {
  font-size:32px;
  margin-bottom:5px;
}

.subtitle {
  color:#6b7280;
  margin-bottom:30px;
}

.section-title {
  font-size:20px;
  margin:30px 0 15px 0;
  font-weight:600;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.jobs-btn {
  font-size:14px;
  background:rgba(37,99,235,0.1);
  color:var(--accent);
  padding:6px 14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
  border:1px solid rgba(37,99,235,0.2);
}

.card {
  background:var(--card-light);
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.card.featured {
  border:1px solid rgba(37,99,235,0.3);
}

.card-header {
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:10px;
}

.industry {
  background:#eef2ff;
  padding:4px 10px;
  border-radius:20px;
}

.badge {
  background:linear-gradient(90deg,#2563eb,#3b82f6);
  color:white;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}

.impact-bar {
  height:6px;
  background:#e5e7eb;
  border-radius:6px;
  margin:10px 0 15px 0;
  overflow:hidden;
}

.impact-fill {
  height:6px;
  background:linear-gradient(90deg,#2563eb,#60a5fa);
}
 
.overall-summary {
  background:rgba(37,99,235,0.08);
  border-left:4px solid var(--accent);
  padding:20px;
  border-radius:12px;
  margin-bottom:30px;
  font-size:16px;
  line-height:1.6;
}
 
.summary {
  font-size:15px;
  line-height:1.5;
}

.charlotte {
  background:rgba(37,99,235,0.06);
  padding:12px;
  border-radius:12px;
  margin-top:12px;
  font-size:14px;
}

.readmore {
  display:inline-block;
  margin-top:15px;
  font-weight:600;
  text-decoration:none;
  color:var(--accent);
}

.footer {
  text-align:center;
  font-size:12px;
  margin-top:40px;
  opacity:0.6;
}

</style>
</head>
<body>

<h1>AI 智能简报</h1>
<p class="subtitle">
2026-04-23 16:28 UTC
</p>
 

 
<div class="section-title">
  <span>⭐ Top 5 Today</span>
  <a href="https://qcai-net.github.io/ainews/aijobs.html" class="jobs-btn">本地 AI 职位 →</a>
</div>


<div class="section-title">All Intelligence</div>


<div class="footer">
Premium AI Intelligence Platform
</div>

</body>
</html>
