<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QCAI WeChat Portal</title>
    <style>
        :root {
            --primary: #07C160; /* WeChat Green */
            --bg: #0d1117;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --accent: #38bdf8;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, hsla(140, 100%, 15%, 0.15) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(200, 100%, 15%, 0.15) 0, transparent 50%);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphism Header */
        header {
            padding: 15px 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Sidebar Toggle Component */
        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        /* Main Layout */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Message Bubbles */
        .message {
            max-width: 80%;
            margin-bottom: 12px;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message.received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #eee;
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message .sender {
            font-size: 10px;
            margin-bottom: 4px;
            opacity: 0.7;
            display: block;
        }

        /* Footer / Input Area */
        footer {
            padding: 15px 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
        }

        button {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active { transform: scale(0.95); opacity: 0.8; }

        button.secondary { background: rgba(255, 255, 255, 0.1); }

        /* Loading Indicator */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center;">
            <a href="index.html" style="text-decoration:none; font-size:1.2rem; margin-right:15px; filter:grayscale(1) brightness(2);">🏠</a>
            <h1><span class="status-dot"></span> WeChat Portal</h1>
        </div>
        <button class="secondary" onclick="executeSync()" style="padding: 8px 12px; font-size: 12px;">Sync All</button>
    </header>


    <main id="chat-area">
        <div class="message received">
            <span class="sender">System</span>
            Welcome to your WeChat Portal. Enter a group name and sync to see messages.
        </div>
    </main>

    <footer>
        <div class="controls" style="margin-bottom: 10px;">
            <input type="text" id="target" placeholder="WeChat Group Name..." list="groups">
            <datalist id="groups">
                <option value="美国税法美股🈲️❗️政论！🎯">
                <option value="美国电耗子车友会（Since 2023）">
            </datalist>
        </div>
        <div class="controls">
            <input type="text" id="message" placeholder="Type a message to send...">
            <button onclick="executeAction('send')">Send</button>
        </div>
    </footer>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
    </div>

    <script>
        const statusEl = document.getElementById('loading');
        const chatArea = document.getElementById('chat-area');

        function appendMessage(sender, content, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `<span class="sender">${sender}</span>${content}`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function executeAction(action) {
            const who = document.getElementById('target').value;
            const msg = document.getElementById('message').value;

            if (!who) {
                alert("Enter a WeChat name first");
                return;
            }

            statusEl.style.display = 'flex';
            
            // Use absolute path for safety in the portal environment
            let cmd = `C:\\Users\\yonwang\\AppData\\Local\\Programs\\Python\\Python312\\python.exe wechat_bridge.py --action ${action} --who "${who}"`;
            if (action === 'send') cmd += ` --msg "${msg}"`;

            try {
                const resp = await fetch('/api/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cmd: cmd })
                });
                const data = await resp.json();
                
                if (action === 'send') {
                    appendMessage('Me', msg, 'sent');
                } else if (data.messages) {
                    chatArea.innerHTML = ''; // Clear for fresh sync
                    data.messages.forEach(m => {
                        const type = (m.sender === 'Me' || m.sender === 'Unknown') ? 'sent' : 'received';
                        appendMessage(m.sender, m.content, type);
                    });
                }
            } catch (e) {
                alert("Portal connection failed. Ensure dashboard.py is running.");
            } finally {
                statusEl.style.display = 'none';
            }
        }

        function executeSync() {
            executeAction('sync');
        }
    </script>
</body>
</html>
